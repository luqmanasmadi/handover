<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handover Checklist</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2433;--mut:#6b7385;--bd:#e3e6ec;--ac:#2563eb;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8ebf2;--mut:#8f97a8;--bd:#2a3040;--ac:#5b8cff;--ok:#34d27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:16px}
.w{max-width:860px;margin:auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.meta label{font-size:12px;color:var(--mut);display:block}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.meta input{width:100%}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.pt{font-size:13px;color:var(--mut);margin-bottom:14px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sec h2{margin:0;padding:10px 14px;font-size:15px;background:color-mix(in srgb,var(--ac) 8%,var(--card));display:flex;justify-content:space-between}
.sec h2 span{font-weight:400;color:var(--mut);font-size:12px}
.it{display:grid;grid-template-columns:24px 1fr 150px;gap:8px;padding:9px 14px;border-top:1px solid var(--bd);align-items:start}
.it.done .t{text-decoration:line-through;color:var(--mut)}
.it input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.t small{display:block;color:var(--mut);font-size:12px}
.it input[type=text]{width:100%;margin-top:4px;font-size:12px;padding:4px 6px}
.dt{font-size:11px;color:var(--ok)}
.sl2{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
textarea{width:100%;font:inherit;font-size:13px;line-height:1.45;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;resize:vertical;margin-top:2px}
.it.done textarea{color:var(--mut)}
select{width:100%}
.add{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--bd)}
.add input{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.x{border:0;background:none;color:var(--mut);padding:0 4px}
@media(max-width:560px){.it{grid-template-columns:24px 1fr}.it .sl{grid-column:2}}
@media print{.add,.row,.x{display:none}}
</style>
</head>
<body>
<div class="w">
<h1>Handover Checklist</h1>
<div class="sub">Tick when done. Pick who it is handed over to. Data is saved in your browser (use Export/Import to share).</div>
<div class="meta">
<div><label>Name</label><input id="m_name"></div>
<div><label>Position</label><input id="m_role"></div>
<div><label>Last working day</label><input id="m_lwd"></div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="pt" id="pt"></div>
<div id="app"></div>
<div class="row">
<button class="p" id="addsec">+ New section</button>
<button id="exp">Export JSON</button>
<button id="imp">Import JSON</button>
<button onclick="window.print()">Print / PDF</button>
<button id="rst">Reset</button>
<input type="file" id="file" accept=".json" hidden>
</div>
</div>
<script>
const PEOPLE=["Naim","Aerma","Fify"];
const KEY="handover_v2";
const META={name:"Nik Luqman",role:"Senior Project Engineer",lwd:"31 October 2026"};
const SUM={
"List of all active pre-commissioning projects":"Projects I currently manage in the pre-commissioning phase. For each one the list shows project name, client, current status, PIC and next action. Takeover should confirm status with each PIC and continue the open follow-ups.",
"Project documentation":"Core project records I maintain: LOA, contract and amendments, costing and budget, VO tracker, PO tracking with invoice/claim status, and the document folder. Takeover needs these to answer commercial questions and keep costing and billing consistent. Start with the folder structure, then compare the costing sheet against the contract value.",
"Morning update: A-B register to OMEGA":"Daily task: every morning, transfer the latest entries from the A-B register into OMEGA so OMEGA reflects the current status. Takeover should do it together with me for a few days, then run it alone.",
"OMEGA access & permissions":"OMEGA accounts and permissions tied to my role. Takeover needs equivalent access before my last day, otherwise the daily update will be blocked.",
"Step-by-step guide (SOP)":"Written steps with screenshots or a short video so the daily OMEGA update can be repeated without me.",
"Common issues & fixes":"Errors and data mismatches I usually run into, the fix for each, and who to contact for support.",
"Shadow session 1-2 days":"Takeover performs the morning update on their own while I watch and correct. Run this for 1-2 days before my last day.",
"Pending approval & payment":"Claims, advances, PRFs and POs that are submitted but not yet approved or paid. Takeover must chase approvals so payments are not delayed after I leave. Record the status and approver for each item.",
"List of systems & accounts used":"Systems, portals and shared mailboxes I use for work. Takeover needs access to each one. Do not record passwords here; request access through IT.",
"Transfer ownership of files & email":"Files, shared folders, distribution lists and recurring meetings I own. Transfer ownership so nothing is lost when my account is closed.",
"SIGMA architecture modules for redevelopment":"Handover of the SIGMA architecture so it can be redeveloped: the modules and what each does, how they connect, source code location, database schema, and SRS/SDD documents. Also note the known gaps and what the redevelopment should fix.",
"NAS / Server setup ready for use":"The NAS/server is built and ready to use. This item records what it is (hardware and OS), how it is connected to the network, and which services run on it (SIGMA S3 storage, Nextcloud + OnlyOffice). Takeover should be able to find and reach it using this note.",
"Admin access & user accounts":"Who holds admin rights on the NAS/server and which user accounts exist with what folder permissions. Transfer admin ownership to the takeover. Do not record passwords here.",
"Backup & restore procedure":"How the server data is backed up (schedule and storage location) and the steps to restore it. Takeover should confirm a restore has been tested.",
"Maintenance & monitoring":"Routine upkeep: OS updates, disk health and uptime checks, and who to contact when the server fails.",
"Setup documentation / runbook":"One document with install steps, config files, diagrams and a troubleshooting guide, so the server can be rebuilt or fixed without me."
};
const mk=(t,d="")=>({t,d,s:SUM[t]||"",done:false,to:"",note:"",at:""});
const DEF=[
{n:"1. Pre-Project Commissioning",i:[
mk("List of all active pre-commissioning projects","Project name, client, status, PIC, next action")]},
{n:"2. Project Documentation",i:[
mk("Project documentation","LOA, contract & amendments, costing & budget, VO tracker, PO tracking & invoice/claim status, document folder")]},
{n:"3. OMEGA",i:[
mk("Morning update: A-B register to OMEGA","Daily procedure: data source, format, timing, who receives"),
mk("OMEGA access & permissions","Transfer / add users, roles, permissions"),
mk("Step-by-step guide (SOP)","Screenshots / short video"),
mk("Common issues & fixes","Usual errors, workarounds, support contact"),
mk("Shadow session 1-2 days","Naim / Aerma / Fify try it themselves, reviewed together")]},
{n:"4. Reports & Finance",i:[
mk("Pending approval & payment","Claim, advance, PRF, PO not yet cleared")]},
{n:"5. Systems & Access",i:[
mk("List of systems & accounts used","Tools, portals, shared mailbox (do not write passwords here)"),
mk("Transfer ownership of files & email","Shared folders, distribution lists, recurring calendar events")]},
{n:"6. SIGMA",i:[
mk("SIGMA architecture modules for redevelopment","Architecture diagram, module list & responsibilities, source code / repo, database schema, SRS / SDD docs, known gaps & redevelopment plan")]},
{n:"7. NAS / Server",i:[
mk("NAS / Server setup ready for use","Hardware & OS specs, network config (IP, DHCP reservation, IT coordination), services running (SIGMA S3 storage, Nextcloud + OnlyOffice)"),
mk("Admin access & user accounts","Admin / root ownership transfer, user accounts, folder permissions (do not write passwords here)"),
mk("Backup & restore procedure","Backup schedule, storage location, tested restore steps"),
mk("Maintenance & monitoring","OS updates, disk health, uptime checks, who to call when it fails"),
mk("Setup documentation / runbook","Install steps, config files, diagrams, troubleshooting guide")]}
];
const fresh=()=>({meta:{...META},secs:JSON.parse(JSON.stringify(DEF))});
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.secs){DEF.forEach(d=>{if(!s.secs.some(x=>x.n===d.n))s.secs.push(JSON.parse(JSON.stringify(d)))});s.secs.forEach(sc=>sc.i.forEach(x=>{if(x.s===undefined)x.s=SUM[x.t]||""}));return s}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const a=document.getElementById("app");a.innerHTML="";
 let tot=0,dn=0;
 S.secs.forEach((s,si)=>{
  const d=s.i.filter(x=>x.done).length;tot+=s.i.length;dn+=d;
  const el=document.createElement("div");el.className="sec";
  el.innerHTML=`<h2>${esc(s.n)}<span>${d}/${s.i.length}</span></h2>`+
  s.i.map((x,ii)=>`<div class="it ${x.done?"done":""}">
   <input type="checkbox" ${x.done?"checked":""} data-a="chk" data-s="${si}" data-i="${ii}">
   <div class="t">${esc(x.t)}<button class="x" data-a="del" data-s="${si}" data-i="${ii}" title="Remove">✕</button>${x.d?`<small>${esc(x.d)}</small>`:""}
   <label class="sl2">Summary</label><textarea rows="3" placeholder="Summary for the person taking over..." data-a="sum" data-s="${si}" data-i="${ii}">${esc(x.s||"")}</textarea>
   <input type="text" placeholder="Notes / file location" value="${esc(x.note)}" data-a="note" data-s="${si}" data-i="${ii}">
   ${x.at?`<span class="dt">Done: ${esc(x.at)}</span>`:""}</div>
   <div class="sl"><select data-a="to" data-s="${si}" data-i="${ii}">
    <option value="">Handover to...</option>${PEOPLE.map(p=>`<option ${x.to===p?"selected":""}>${p}</option>`).join("")}
   </select></div></div>`).join("")+
  `<div class="add"><input placeholder="Add item..." data-a="newt" data-s="${si}"><button data-a="add" data-s="${si}">Add</button></div>`;
  a.appendChild(el);
 });
 const p=tot?Math.round(dn/tot*100):0;
 document.getElementById("bar").style.width=p+"%";
 document.getElementById("pt").textContent=`${dn}/${tot} done (${p}%)`;
 ["name","role","lwd"].forEach(k=>document.getElementById("m_"+k).value=S.meta[k]||"");
}
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id&&t.id.startsWith("m_")){S.meta[t.id.slice(2)]=t.value;save();return}
 if(t.dataset.a==="note"){S.secs[t.dataset.s].i[t.dataset.i].note=t.value;save()}
 if(t.dataset.a==="sum"){S.secs[t.dataset.s].i[t.dataset.i].s=t.value;save()}
});
document.addEventListener("change",e=>{
 const t=e.target,a=t.dataset.a;if(!a)return;
 const it=S.secs[t.dataset.s]&&S.secs[t.dataset.s].i[t.dataset.i];
 if(a==="chk"){it.done=t.checked;it.at=t.checked?new Date().toLocaleDateString("en-GB"):"";save();render()}
 if(a==="to"){it.to=t.value;save()}
});
document.addEventListener("click",e=>{
 const t=e.target,a=t.dataset.a;if(!a)return;
 if(a==="del"){if(confirm("Remove this item?")){S.secs[t.dataset.s].i.splice(t.dataset.i,1);save();render()}}
 if(a==="add"){const inp=t.previousElementSibling;if(inp.value.trim()){S.secs[t.dataset.s].i.push(mk(inp.value.trim()));save();render()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.a==="newt")e.target.nextElementSibling.click()});
document.getElementById("addsec").onclick=()=>{const n=prompt("Section name:");if(n){S.secs.push({n,i:[]});save();render()}};
document.getElementById("rst").onclick=()=>{if(confirm("Reset everything?")){S=fresh();save();render()}};
document.getElementById("exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="handover.json";a.click()};
document.getElementById("imp").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.secs){S=d;save();render()}}catch(x){alert("Invalid file")}};r.readAsText(f)};
render();
</script>
</body>
</html>
